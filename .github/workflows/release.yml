name: Release

# Versions and tags pushes to `main` using git/commit semantics
# (Conventional Commits):
#   fix: ...            -> patch  (v1.2.3 -> v1.2.4)
#   feat: ...           -> minor  (v1.2.3 -> v1.3.0)
#   feat!: / BREAKING CHANGE in body -> major (v1.2.3 -> v2.0.0)
# Commits that don't match fall back to `default_bump` (patch).

on:
  push:
    branches: [main]

# Avoid overlapping releases if commits land in quick succession.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push tags and create releases

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version and create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch
          tag_prefix: v

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
